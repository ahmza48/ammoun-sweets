<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ammoun Sweets">
  <!--
    App icon. Same mark as src/components/Logo.tsx — a baklava lozenge cut
    into three filo bands — on the brand green.

    The mark is scaled to ~76% and centred rather than filling the tile, so it
    keeps a margin inside the rounded square at small sizes. The ringed variant
    was tried and turns to mud at 16px; bare bands stay legible.
  -->
  <rect width="64" height="64" rx="14" fill="#123b2a"/>
  <g transform="translate(32 32) scale(0.76) translate(-32 -32)"
     fill="#d9bd85" stroke="#d9bd85" stroke-width="1.8" stroke-linejoin="round">
    <path d="M32 8 42.9 18.9 21.1 18.9Z"/>
    <path d="M47.5 23.5 56 32 47.5 40.5 16.5 40.5 8 32 16.5 23.5Z"/>
    <path d="M42.9 45.1 32 56 21.1 45.1Z"/>
  </g>
</svg>
